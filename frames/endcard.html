<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px; height: {{HEIGHT}}px; background: #0c0c0f;
    font-family: -apple-system, "SF Pro Display", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; }
  .wordmark { color: #f5f5f7; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .wordmark .dot { color: #ff5c1c; }
  .sub { margin-top: 14px; color: #8a8a92; font-size: 17px; }
  .sub b { color: #c9c9cf; font-weight: 600; }
</style>
<body>
  <div class="card">
    <div class="wordmark">{{TITLE}}</div>
    <div class="sub">{{SUBTITLE}}</div>
  </div>
</body>
