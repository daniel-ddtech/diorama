<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 900px; background: #0c0c0f; font-family: -apple-system, "SF Pro Text", sans-serif; }
  .chrome { height: 100px; background: linear-gradient(#26262b, #202024); border-bottom: 1px solid #000; padding: 10px 14px 0; }
  .row1 { display: flex; align-items: center; gap: 8px; height: 36px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .tab { margin-left: 14px; background: #3a3a41; color: #e8e8ea; font-size: 13px; padding: 8px 18px; border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 8px; max-width: 380px; white-space: nowrap; overflow: hidden; }
  .tab img { width: 14px; height: 14px; border-radius: 3px; }
  .row2 { display: flex; align-items: center; gap: 10px; height: 44px; padding-top: 6px; }
  .nav { color: #9a9aa2; font-size: 17px; width: 24px; text-align: center; }
  .omni { flex: 1; background: #1a1a1f; border: 1px solid #333; border-radius: 999px; color: #c9c9cf; font-size: 13px; padding: 9px 16px; display: flex; gap: 8px; align-items: center; }
  .lock { color: #8a8a92; font-size: 12px; }
  .ext { width: 26px; height: 26px; border-radius: 6px; background: #2e2e34; display: flex; align-items: center; justify-content: center; }
  .ext img { width: 18px; height: 18px; }
  .ext.active { outline: 2px solid #ff5c1c; }
</style>
<body>
  <div class="chrome">
    <div class="row1">
      <div class="dot" style="background:#ff5f57"></div>
      <div class="dot" style="background:#febc2e"></div>
      <div class="dot" style="background:#28c840"></div>
      <div class="tab"><img src="reddit-fav.png" onerror="this.style.display='none'">Has anyone found a Magnesium supplement that actually improves…</div>
    </div>
    <div class="row2">
      <div class="nav">←</div><div class="nav">→</div><div class="nav">⟳</div>
      <div class="omni"><span class="lock">🔒</span>reddit.com/r/sleep/comments/has_anyone_found_a_magnesium_supplement…</div>
      <div class="ext active"><img src="tmp-ext-icon.png"></div>
    </div>
  </div>
</body>
